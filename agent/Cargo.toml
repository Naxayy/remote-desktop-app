[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "Agente que corre en la PC remota: servicio de Windows + engine + conexion de red."

[dependencies]
core_engine = { path = "../core-engine" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "=0.20.1", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

x25519-dalek = { version = "2", features = ["getrandom"] }
zeroize = "=1.7.0"
zeroize_derive = "=1.4.2"

# Mismo pin que en signaling-server: evita que este sandbox (cargo 1.75)
# se tope con crates que ya requieren edition2024. Probablemente no haga
# falta en tu maquina con rustup al dia.
idna_adapter = "=1.0.0"

# minifb (ventana del dev_viewer) solo hace falta en Windows.
[target.'cfg(windows)'.dev-dependencies]
minifb = "0.27"

# Instalar/correr el agent como servicio de Windows (arranque antes
# del login, LocalSystem).
[target.'cfg(windows)'.dependencies.windows-service]
version = "0.7"

# API de bajo nivel para lanzar el proceso worker dentro de la sesion
# del usuario logueado (los servicios de Windows corren en la sesion 0,
# sin acceso al escritorio - hay que "saltar" a la sesion del usuario).
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Environment",
]
